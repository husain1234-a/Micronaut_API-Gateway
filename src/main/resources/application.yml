# Basic Gateway Configuration
micronaut:
  application:
    name: api-gateway
    type: application
  server:
    port: 8085
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - http://localhost:3000
            - http://localhost:8080
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "*"
          allow-credentials: true

  security:
    enabled: true
    reject-not-found: false
    authentication: bearer
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: mySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmPleaseChangeInProduction
        generator:
          access-token:
            expiration: 3600
    intercept-url-map:
      - pattern: /**
        access:
          - isAnonymous()
      - pattern: /health
        access:
          - isAnonymous()
      - pattern: /api/auth/login
        access:
          - isAnonymous()
      - pattern: /api/users/auth/**
        access:
          - isAnonymous()
      - pattern: /api/users/**
        access:
          - isAnonymous()
        methods:
          - GET
          - POST
          - PUT
          - DELETE
      - pattern: /api/users
        access:
          - isAnonymous()
        methods:
          - GET
          - POST
          - PUT
          - DELETE

  router:
    routes:
      - id: user-management
        uri: http://localhost:8081
        predicates:
          - path:/api/users/**
        filters:
          - rewrite-path:/api/users/(?<segment>.*) ? /users/${segment}
      - id: notification-service
        uri: http://localhost:9000
        predicates:
          - path:/api/notifications/**
        filters:
          - rewrite-path:/api/notifications/(?<segment>.*) ? /notifications/${segment}
      

  http:
    client:
      read-timeout: 30s
      connect-timeout: 10s
    services:
      user-service:
        urls:
          - http://localhost:8081
          - http://localhost:8082
      notification-service:
        urls:
          - http://localhost:8083
          - http://localhost:8084

endpoints:
  health:
    enabled: true
    sensitive: false
  info:
    enabled: true

logger:
  levels:
    io.micronaut.security: TRACE
    io.micronaut.http: TRACE
    io.micronaut.web.router: TRACE
    io.micronaut.discovery: DEBUG
    io.micronaut.discovery.consul: DEBUG

consul:
  client:
    host: localhost
    port: 8500
    registration:
      enabled: true
    discovery:
      enabled: true
    defaultZone: "${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}"

ratelimit:
  maxRequests: 100
  windowMs: 60000 