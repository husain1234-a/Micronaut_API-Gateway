# Basic Gateway Configuration
micronaut.application.name=api-gateway
micronaut.server.port=8080

# Security Configuration
micronaut.security.enabled=true
micronaut.security.reject-not-found=false

# JWT Configuration
micronaut.security.token.jwt.enabled=true
micronaut.security.token.jwt.signatures.secret.generator.secret=mySecretKeyThatShouldBeAtLeast256BitsLongForHS256AlgorithmPleaseChangeInProduction
micronaut.security.token.jwt.generator.access-token.expiration=3600

# Authentication Provider Configuration (simple in-memory for testing)
micronaut.security.authentication=bearer

# Login/Logout Endpoints
micronaut.security.endpoints.login.enabled=true
micronaut.security.endpoints.logout.enabled=true

# CORS Configuration
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins[0]=http://localhost:3000
micronaut.server.cors.configurations.web.allowed-origins[1]=http://localhost:8080
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-methods[4]=OPTIONS
micronaut.server.cors.configurations.web.allowed-headers[0]=*
micronaut.server.cors.configurations.web.allow-credentials=true

# Route Security Rules - Order matters!
# Health endpoint - public
micronaut.security.intercept-url-map[0].pattern=/health
micronaut.security.intercept-url-map[0].access[0]=isAnonymous()

# Login endpoint - public (gateway's own login, if any)
micronaut.security.intercept-url-map[1].pattern=/login
micronaut.security.intercept-url-map[1].access[0]=isAnonymous()

# User microservice login endpoint - public
micronaut.security.intercept-url-map[2].pattern=/api/auth/login
micronaut.security.intercept-url-map[2].access[0]=isAnonymous()

# User service routes with different permissions
micronaut.security.intercept-url-map[3].pattern=/api/users
micronaut.security.intercept-url-map[3].http-method=GET
micronaut.security.intercept-url-map[3].access[0]=isAuthenticated()

micronaut.security.intercept-url-map[4].pattern=/api/users
micronaut.security.intercept-url-map[4].http-method=POST
micronaut.security.intercept-url-map[4].access[0]=hasRole('ADMIN')

micronaut.security.intercept-url-map[5].pattern=/api/users/**
micronaut.security.intercept-url-map[5].http-method=PUT
micronaut.security.intercept-url-map[5].access[0]=hasAnyRole('USER','ADMIN')

micronaut.security.intercept-url-map[6].pattern=/api/users/**
micronaut.security.intercept-url-map[6].http-method=DELETE
micronaut.security.intercept-url-map[6].access[0]=hasRole('ADMIN')

# Notification service routes
micronaut.security.intercept-url-map[7].pattern=/api/notifications/**
micronaut.security.intercept-url-map[7].access[0]=isAuthenticated()

# Default - require authentication for all other API routes
micronaut.security.intercept-url-map[8].pattern=/api/**
micronaut.security.intercept-url-map[8].access[0]=isAuthenticated()

# User Service Routes
micronaut.router.routes[0].id=user-service
micronaut.router.routes[0].uri=http://localhost:8081
micronaut.router.routes[0].predicates[0]=path:/api/users/**
micronaut.router.routes[0].filters[0]=rewrite-path:/api/users/(?<segment>.*) ? /users/${segment}

# Auth endpoints (handled by user service)
micronaut.router.routes[1].id=user-auth
micronaut.router.routes[1].uri=http://localhost:8081
micronaut.router.routes[1].predicates[0]=path:/api/auth/**
micronaut.router.routes[1].filters[0]=rewrite-path:/api/auth/(?<segment>.*) ? /api/auth/${segment}

# Notification Service Routes
micronaut.router.routes[2].id=notification-service
micronaut.router.routes[2].uri=http://localhost:8083
micronaut.router.routes[2].predicates[0]=path:/api/notifications/**
micronaut.router.routes[2].filters[0]=rewrite-path:/api/notifications/(?<segment>.*) ? /notifications/${segment}

# HTTP Client Settings
micronaut.http.client.read-timeout=30s
micronaut.http.client.connect-timeout=10s

# Load Balancer (Multiple Instances)
micronaut.http.services.user-service.urls[0]=http://localhost:8081
micronaut.http.services.user-service.urls[1]=http://localhost:8082
micronaut.http.services.notification-service.urls[0]=http://localhost:8083
micronaut.http.services.notification-service.urls[1]=http://localhost:8084

# Health and Monitoring Endpoints
endpoints.health.enabled=true
endpoints.info.enabled=true
endpoints.health.sensitive=false

# Logging Configuration
logger.levels.io.micronaut.security=DEBUG
logger.levels.io.micronaut.http.client=DEBUG

ratelimit.maxRequests=100
ratelimit.windowMs=60000

# Consul Service Discovery
consul.client.host=localhost
consul.client.port=8500
consul.client.registration.enabled=true
consul.client.discovery.enabled=true