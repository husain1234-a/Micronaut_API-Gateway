plugins {
    id("com.github.johnrengelman.shadow") version "8.1.1"
    id("io.micronaut.application") version "4.5.0"
    id("io.micronaut.aot") version "4.5.0"
}

version = "0.1"
group = "com.example"

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // Import Micronaut BOM for consistent versions
    implementation platform("io.micronaut.platform:micronaut-platform:4.5.0")

    // Micronaut Core
    annotationProcessor("io.micronaut:micronaut-http-validation")
    implementation("io.micronaut:micronaut-http-client")
    implementation("io.micronaut:micronaut-jackson-databind")
    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut:micronaut-http-server-netty")

    // Validation
    implementation("io.micronaut.validation:micronaut-validation")

    // Service Discovery
    implementation("io.micronaut.discovery:micronaut-discovery-client")

    // Minimal Security Dependencies
    implementation("io.micronaut.security:micronaut-security")
    implementation("io.micronaut.security:micronaut-security-jwt")

    // Logging
    runtimeOnly("ch.qos.logback:logback-classic")

    // Testing
    testImplementation("io.micronaut:micronaut-http-client")
    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("io.micronaut.security:micronaut-security-jwt")
}

application {
    mainClass.set("com.example.Application")
}

java {
    sourceCompatibility = JavaVersion.toVersion("17")
    targetCompatibility = JavaVersion.toVersion("17")
}

graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.example.*")
    }
    aot {
        // enabled = true
    }
}